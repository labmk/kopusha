name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: gofmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      # go vet compiles the packages, so it needs CGO and the DuckDB
      # archive. static/ contains only .gitkeep at this point — that is
      # enough for `//go:embed static/*` to resolve, which is the whole
      # reason the placeholder is committed.
      - name: go vet
        env:
          CGO_ENABLED: '1'
        run: go vet ./...

  # CGO (DuckDB) means every target needs a matching C toolchain and the
  # prebuilt libduckdb_static.a for that platform, so each one builds on
  # a native runner. macOS is Apple Silicon only — Intel is not a
  # supported target, which is also why no Intel runner appears here.
  #
  # The matrix is computed rather than literal because macOS runners bill
  # at 10x while this repository is private — roughly 200 minutes for one
  # full run against a 2,000/month allowance. Ordinary pushes therefore
  # build Linux (1x) and Windows (2x) only; tags and manual dispatch get
  # everything. Make the repository public and this distinction stops
  # mattering, since standard runners are free there.
  targets:
    name: select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          core='[
            {"name":"linux-amd64","runner":"ubuntu-latest","goos":"linux","goarch":"amd64","artifact":"kopusha","e2e":true},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","goos":"linux","goarch":"arm64","artifact":"kopusha"},
            {"name":"windows-amd64","runner":"windows-latest","goos":"windows","goarch":"amd64","artifact":"kopusha.exe","e2e":true}
          ]'
          mac='[
            {"name":"darwin-arm64","runner":"macos-26","goos":"darwin","goarch":"arm64","artifact":"kopusha"}
          ]'
          if [ "$FULL" = "true" ]; then
            include="$(jq -cn --argjson a "$core" --argjson b "$mac" '$a + $b')"
          else
            include="$(jq -cn --argjson a "$core" '$a')"
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          jq -n --argjson i "$include" '$i | map(.name)'

  build:
    name: ${{ matrix.name }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No MSYS2 setup step. Installing mingw-w64-ucrt-x86_64-gcc pulled
      # GCC 16.1.0, whose linker died on the prebuilt libduckdb_static.a
      # with `ld returned 5 exit status` and no symbol diagnostics — an
      # ld crash, consistent with the ABI drift this project already
      # documents for GCC 15.x. Upstream duckdb-go builds on
      # windows-latest with the runner's stock toolchain and no setup
      # step at all, so match that; build.sh probes for a compiler and
      # prints which one it picked.
      - name: Windows toolchain probe
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          echo "gcc on PATH: $(command -v gcc || echo '<none>')"
          command -v gcc >/dev/null && gcc --version | head -1
          for c in /c/msys64/ucrt64/bin/gcc.exe \
                   /c/msys64/mingw64/bin/gcc.exe \
                   /c/mingw64/bin/gcc.exe; do
            [ -x "$c" ] && echo "candidate: $c -> $("$c" -dumpversion)"
          done
          true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MATRIX_CC: ${{ matrix.cc }}
          SKIP_VULNCHECK: '1'   # the dedicated job below runs it once
        run: |
          if [ -n "$MATRIX_CC" ]; then
            export CC="$MATRIX_CC"
          fi
          # A tagged build stamps the tag as the version so the binary
          # never reports build.sh's default after a release bump.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          chmod +x build.sh
          ./build.sh

      - name: Go tests
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go test ./...

      # e2e drives the real binary through a browser, so it only runs
      # where the artifact is natively executable.
      - name: Playwright e2e
        if: matrix.e2e
        shell: bash
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload failed e2e report
        if: failure() && matrix.e2e
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.name }}
          path: frontend/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: kopusha-${{ matrix.name }}
          path: |
            dist/${{ matrix.artifact }}
            dist/parsers.d/
            dist/kopusha.conf
          if-no-files-found: error

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, vulncheck, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance. `id-token` mints the short-lived OIDC token
      # that identifies this workflow to Sigstore; `attestations` lets
      # the run record the result against the repository. No key is
      # stored anywhere — the signing certificate is issued for the
      # duration of the run and expires, so there is nothing to leak,
      # rotate, or renew.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: kopusha-*

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out

          for dir in staging/kopusha-*; do
            platform="${dir#staging/kopusha-}"
            # upload-artifact does not preserve the executable bit, so
            # restore it before archiving — otherwise every download
            # arrives chmod 644 and will not run.
            [ -f "$dir/kopusha" ] && chmod +x "$dir/kopusha"
            # THIRD-PARTY-NOTICES.md is not documentation — MIT and BSD
            # require their notices to travel with the binary, so it goes
            # in every archive.
            cp LICENSE README.md THIRD-PARTY-NOTICES.md sbom.cdx.json "$dir/"

            # zip for every platform, not tar.gz for Unix. One format
            # means one set of instructions, and zip is the one every
            # target opens without installing anything — including a
            # Windows machine handed a Linux build to forward on.
            #
            # Info-ZIP stores the Unix mode in the external file
            # attributes and `unzip` restores it, so the executable bit
            # survives a Unix-to-Unix round trip (verified). It does not
            # survive extraction by tools that ignore those attributes,
            # which is most Windows GUI extractors — hence the chmod
            # note in the release body.
            name="kopusha-${VERSION}-${platform}"
            (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/out/${name}.zip" .)
          done

          # Also publish the SBOM as a standalone asset so it can be
          # consumed without downloading a platform archive.
          cp sbom.cdx.json out/

          (cd out && sha256sum ./* > SHA256SUMS)
          ls -l out

      # Provenance, not authorship. This records — signed, publicly and
      # verifiably — that these exact bytes were produced by this
      # workflow, from this repository, at this commit.
      #
      # It is deliberately not a code-signing certificate. Those exist
      # so a CA vouches for a legal identity, and they are what silences
      # Gatekeeper and SmartScreen; that remains open as #24. This
      # answers the different and more useful question: was this file
      # built from the source it claims to come from, or substituted
      # somewhere between the build and the download?
      #
      # SHA256SUMS on its own could never answer that. It proves a
      # download is intact against a list published in the same place
      # by whoever published the file — including an attacker who
      # replaced both.
      #
      # Attesting the archives rather than SHA256SUMS is deliberate:
      # verification then covers the artifact the user actually runs,
      # with no intermediate file to trust.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/*.zip'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          notes="$(printf '%s\n' \
            "See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for what changed." \
            "" \
            "Every archive is a zip, on every platform." \
            "" \
            "On Linux and macOS, if the binary does not run after extracting," \
            'restore the executable bit: `chmod +x kopusha`. Most extractors' \
            "preserve it; some Windows GUI tools do not." \
            "" \
            "**Verify what you downloaded.** Every archive carries a signed" \
            "build attestation proving it was produced by this repository's" \
            "workflow, from this commit:" \
            "" \
            '```' \
            "gh attestation verify kopusha-${GITHUB_REF_NAME#v}-linux-amd64.zip --repo ${REPO}" \
            '```' \
            "" \
            "That is a stronger check than \`SHA256SUMS\`, which only shows a" \
            "download is intact against a list published alongside it." \
            "" \
            "Binaries are **not** code-signed with a certificate, which is a" \
            "separate thing: it is what stops the operating system warning." \
            "On macOS, clear the quarantine attribute before running:" \
            '`xattr -d com.apple.quarantine kopusha`  — see docs/BUILD.md.')"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            out/*
