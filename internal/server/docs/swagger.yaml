basePath: /
definitions:
  server.AdapterVerdict:
    properties:
      name:
        description: Name is the adapter name, e.g. "ndjson", "line".
        example: line
        type: string
      reason:
        description: Reason is why, in one sentence.
        example: 'none of 5 rule(s) matched any of the first 40 non-blank lines: iso-bracket,
          dashdate-level'
        type: string
      score:
        description: |-
          Score is what Detect returned: 0 declines, 100 is an exact magic
          match. The highest score wins, ties broken by name.
        example: 0
        type: integer
    type: object
  server.BrowseEntry:
    properties:
      is_dir:
        type: boolean
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  server.BrowseResponse:
    properties:
      current_path:
        type: string
      drives:
        items:
          type: string
        type: array
      entries:
        items:
          $ref: '#/definitions/server.BrowseEntry'
        type: array
      in_zip:
        type: boolean
    type: object
  server.DiagnosisResponse:
    properties:
      adapters:
        items:
          $ref: '#/definitions/server.AdapterVerdict'
        type: array
      best_score:
        example: 0
        type: integer
      chosen:
        description: |-
          Chosen is the adapter that would handle the file, empty when
          nothing matched.
        example: ""
        type: string
      first_line:
        description: |-
          FirstLine is the first non-blank line as the parser sees it,
          after BOM removal and CRLF folding.
        example: '2026-03-18T06:00:00 gateway[4179]: queue depth 2347'
        type: string
      notes:
        description: Notes are encoding traits that break matching invisibly.
        items:
          type: string
        type: array
      path:
        type: string
    type: object
  server.ErrorResponse:
    properties:
      error:
        example: something failed
        type: string
    type: object
  server.ExportRequest:
    properties:
      output_path:
        type: string
      query:
        $ref: '#/definitions/server.QueryRequest'
    type: object
  server.ExportResponse:
    properties:
      path:
        type: string
      records:
        type: integer
      status:
        type: string
    type: object
  server.FileInfo:
    properties:
      enabled:
        type: boolean
      format:
        type: string
      id:
        type: string
      name:
        type: string
      path:
        type: string
      records:
        type: integer
      size:
        type: integer
    type: object
  server.FilesResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/server.FileInfo'
        type: array
      timestamp_field:
        type: string
    type: object
  server.FilterClause:
    properties:
      combinator:
        type: string
      field:
        type: string
      operator:
        type: string
      value:
        type: string
    type: object
  server.IDRequest:
    properties:
      id:
        type: string
    type: object
  server.LoadDirResponse:
    properties:
      errors:
        items:
          type: string
        type: array
      loaded:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  server.ModuleManifest:
    properties:
      bundle:
        type: string
      config:
        additionalProperties: true
        type: object
      id:
        type: string
      style:
        type: string
      tab:
        additionalProperties: true
        type: object
    type: object
  server.ModulesResponse:
    properties:
      modules:
        items:
          $ref: '#/definitions/server.ModuleManifest'
        type: array
    type: object
  server.PathRequest:
    properties:
      path:
        type: string
    type: object
  server.PreviewLine:
    properties:
      status:
        description: |-
          Status is "parsed" when the line opened a record, or
          "continuation" when it was appended to the previous record.
        example: parsed
        type: string
      text:
        type: string
      ts:
        description: TS is the raw captured timestamp text, before the layout runs.
        type: string
      ts_error:
        description: TSError is why that text could not be turned into a timestamp.
        type: string
    type: object
  server.PreviewRequest:
    properties:
      rule:
        $ref: '#/definitions/server.RuleDraft'
      sample:
        type: string
    type: object
  server.PreviewResponse:
    properties:
      continuation:
        type: integer
      error:
        description: |-
          Error is set when the rule itself is unusable, e.g. the regex
          does not compile. Reported in-band because that is an ordinary
          state while editing.
        type: string
      fields:
        description: Fields are the capture names in regex order.
        items:
          type: string
        type: array
      lines:
        items:
          $ref: '#/definitions/server.PreviewLine'
        type: array
      parsed:
        description: Parsed and Continuation count the sample lines by status.
        type: integer
      rows:
        items:
          additionalProperties: true
          type: object
        type: array
      timestamp_errors:
        description: |-
          TimestampErrors counts parsed lines whose timestamp the layout
          rejected — rows that would load with no time on them.
        type: integer
      warnings:
        items:
          type: string
        type: array
    type: object
  server.QueryRequest:
    properties:
      filters:
        items:
          $ref: '#/definitions/server.FilterClause'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      search_text:
        type: string
      sort_field:
        type: string
      sort_order:
        enum:
        - asc
        - desc
        type: string
      time_from:
        type: string
      time_to:
        type: string
    type: object
  server.QueryResponse:
    properties:
      fields:
        items:
          type: string
        type: array
      limit:
        type: integer
      offset:
        type: integer
      rows:
        items:
          additionalProperties: true
          type: object
        type: array
      total_count:
        type: integer
    type: object
  server.RuleDraft:
    properties:
      message_field:
        description: |-
          MessageField names the field non-matching lines are appended to.
          Defaults to "message".
        type: string
      name:
        example: gateway-log
        type: string
      parse:
        description: |-
          Parse must capture the timestamp as (?P<ts>...). Every other
          named group becomes a field.
        type: string
      priority:
        example: 50
        type: integer
      sample:
        description: |-
          Sample is the text the rule was inferred from; saved into the
          rule file as a header comment.
        type: string
      ts_assume_tz:
        description: TsAssumeTZ names the zone for timestamps that carry none.
        example: Europe/Berlin
        type: string
      ts_layout:
        description: |-
          TsLayout is a Go time layout — the reference time spelled out,
          e.g. 2006-01-02 15:04:05 — not a strftime pattern.
        example: "2006-01-02 15:04:05"
        type: string
      ts_regex_subs:
        items:
          $ref: '#/definitions/server.RuleSub'
        type: array
      ts_use_mtime_date:
        description: |-
          TsUseMtimeDate supplies the date from the file's modification
          time, for formats carrying only a time of day.
        type: boolean
      ts_use_mtime_year:
        description: |-
          TsUseMtimeYear supplies only the year, for formats carrying month
          and day but no year.
        type: boolean
      warnings:
        description: Warnings are advisory — an ambiguous date order, a missing year.
        items:
          type: string
        type: array
    type: object
  server.RuleInfo:
    properties:
      family:
        example: line
        type: string
      file:
        example: 20-line-iso-bracket.yaml
        type: string
      name:
        example: iso-bracket
        type: string
      priority:
        example: 100
        type: integer
    type: object
  server.RuleSub:
    properties:
      pattern:
        type: string
      replacement:
        type: string
    type: object
  server.RulesResponse:
    properties:
      dir:
        description: Dir is the parsers.d directory the rules were read from.
        type: string
      rules:
        items:
          $ref: '#/definitions/server.RuleInfo'
        type: array
    type: object
  server.SampleRequest:
    properties:
      sample:
        type: string
    type: object
  server.SaveRuleRequest:
    properties:
      overwrite:
        description: Overwrite replaces an existing rule file of the same name.
        type: boolean
      rule:
        $ref: '#/definitions/server.RuleDraft'
    type: object
  server.SaveRuleResponse:
    properties:
      file:
        example: 50-line-gateway-log.yaml
        type: string
      path:
        type: string
      rules:
        description: Rules is how many line rules are loaded after the save.
        example: 6
        type: integer
      status:
        example: ok
        type: string
    type: object
  server.SelfCopyRequest:
    properties:
      target_dir:
        type: string
    type: object
  server.SelfCopyResponse:
    properties:
      path:
        type: string
      status:
        type: string
    type: object
  server.SettingsBody:
    properties:
      auto_load_previous:
        type: boolean
      last_directory:
        type: string
    type: object
  server.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  server.TimeRangeResponse:
    properties:
      max:
        type: string
      min:
        type: string
      timestamp_fields:
        items:
          type: string
        type: array
    type: object
  server.TimestampFieldRequest:
    properties:
      field:
        type: string
    type: object
  server.TimestampFieldResponse:
    properties:
      field:
        type: string
      status:
        type: string
    type: object
  server.ToggleRequest:
    properties:
      enabled:
        type: boolean
      id:
        type: string
    type: object
  server.UpdateResponse:
    properties:
      available:
        description: Available is true only when latest is confidently newer.
        type: boolean
      checked:
        description: |-
          Checked is false until a check completes, so "unknown" is
          distinguishable from "up to date".
        type: boolean
      current:
        description: Current is the running version.
        example: 0.1.0
        type: string
      enabled:
        description: Enabled mirrors update_check in obs_viewer.conf.
        type: boolean
      latest:
        description: Latest is the newest published release, absent if unknown.
        example: 0.2.0
        type: string
      url:
        description: URL is the release page.
        example: https://github.com/labmk/obs-viewer/releases/tag/v0.2.0
        type: string
    type: object
  server.VersionResponse:
    properties:
      arch:
        type: string
      idle_timeout_seconds:
        type: integer
      os:
        type: string
      version:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Local viewer for log, metric and trace files: NDJSON, EVTX,
    XML, and rule-driven text logs, queried through DuckDB.
    The OpenAPI spec is the source of truth for the generated
    TypeScript client used by the React frontend.
  title: obs-viewer API
  version: 0.2.0
paths:
  /api/browse:
    get:
      description: Lists directory contents (or zip-archive contents when the path
        points at a .zip file). Browsers cannot access the local filesystem; this
        endpoint is how the file picker enumerates folders.
      parameters:
      - description: absolute path to list; defaults to the user home directory
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.BrowseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Backend file browser
      tags:
      - files
  /api/export:
    post:
      consumes:
      - application/json
      description: Reruns the query against DuckDB and writes the result to output_path
        via COPY ... (FORMAT JSON, ARRAY false).
      parameters:
      - description: query + output path
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.ExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ExportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Export filtered rows to NDJSON
      tags:
      - export
  /api/export/self-copy:
    post:
      consumes:
      - application/json
      description: F13 — drops the running binary into target_dir so a single zip
        can carry both data and viewer.
      parameters:
      - description: destination directory
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.SelfCopyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SelfCopyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Copy the binary alongside exported data
      tags:
      - export
  /api/field-samples:
    get:
      description: Returns the DISTINCT value set per requested field (default list
        when `fields` query param is absent). Fields whose distinct count exceeds
        the cap (30) are returned with an empty array — signal to the caller that
        the field is too high-cardinality to be useful as a literal value list. Feeds
        the query builder's value-suggestion datalist.
      parameters:
      - description: 'comma-separated list of field names; default: service.name,host.name,SeverityText,log.level,event.category,_source_format'
        in: query
        name: fields
        type: string
      - description: max values per field (default 30)
        in: query
        name: cap
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Distinct sample values for low-cardinality fields
      tags:
      - query
  /api/files:
    get:
      description: Returns every file the engine currently has loaded plus the auto-detected
        timestamp column.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.FilesResponse'
      summary: List loaded files
      tags:
      - files
  /api/files/explain:
    post:
      consumes:
      - application/json
      description: 'Runs every ingest adapter''s detection against the file and reports
        each one''s score and reason, the first non-blank line as the parser sees
        it, and any encoding trait that commonly breaks matching (BOM, CRLF, NUL bytes,
        invalid UTF-8). Read-only: nothing is loaded. This is what the UI shows when
        a load fails, and it is the input to the rule builder.'
      parameters:
      - description: path to diagnose
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.PathRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.DiagnosisResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Explain how a file was, or was not, matched
      tags:
      - files
  /api/files/load:
    post:
      consumes:
      - application/json
      description: Loads a single file by absolute path. Supports virtual zip paths
        in the form `C:\foo.zip|inner.ndjson` — the inner entry is extracted next
        to the zip and then ingested. Dispatches through the ingest layer so non-NDJSON
        formats (EVTX, XML, block, line) are handled too.
      parameters:
      - description: path to load
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.PathRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Load a file
      tags:
      - files
  /api/files/load-dir:
    post:
      consumes:
      - application/json
      description: Bulk load. Each file is ingested through the dispatch layer; unsupported
        entries land in `errors` rather than aborting the load.
      parameters:
      - description: directory or zip path
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.PathRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LoadDirResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Load every supported file in a directory or zip
      tags:
      - files
  /api/files/toggle:
    post:
      consumes:
      - application/json
      description: Toggles whether a loaded file participates in subsequent queries.
        Cheaper than unload+load — the table stays in DuckDB, just excluded from UNION
        ALL.
      parameters:
      - description: file id + enabled flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.ToggleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Enable / disable a file
      tags:
      - files
  /api/files/unload:
    post:
      consumes:
      - application/json
      parameters:
      - description: file id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Unload a file
      tags:
      - files
  /api/modules:
    get:
      description: Returns one manifest per enabled module in Add() order. The SPA
        reads this at boot to decide which tabs to render and to inject the branding
        stylesheet + favicons.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ModulesResponse'
      summary: List enabled modules
      tags:
      - modules
  /api/query:
    post:
      consumes:
      - application/json
      description: Runs the assembled filter set (field clauses, time window, optional
        free-text search) against the UNION ALL of enabled files. Sort, offset, and
        limit drive paging. Free-text search uses DuckDB ILIKE on a TRY_CAST-VARCHAR'd
        row.
      parameters:
      - description: query parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.QueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.QueryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Query the loaded files
      tags:
      - query
  /api/rules:
    get:
      description: Every rule currently loaded from parsers.d, with the file it came
        from. Used by the rule builder to warn before a name collides with an existing
        rule.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.RulesResponse'
      summary: List parser rules
      tags:
      - rules
  /api/rules/preview:
    post:
      consumes:
      - application/json
      description: Runs a candidate rule over sample text through the real line adapter
        and returns the rows, the per-line verdict (parsed or folded into the previous
        record as a continuation), and any timestamp that the layout rejected. Nothing
        is written.
      parameters:
      - description: draft rule + sample
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.PreviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.PreviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Preview what a rule would produce
      tags:
      - rules
  /api/rules/save:
    post:
      consumes:
      - application/json
      description: Writes the rule as a YAML file next to the binary and reloads the
        parser registry, so it applies to files loaded afterwards without a restart.
        The rule name is normalized into a filename; a rule that fails to compile
        is not left on disk. Existing files are only replaced when overwrite is set.
      parameters:
      - description: draft rule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.SaveRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SaveRuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Save a rule to parsers.d
      tags:
      - rules
  /api/rules/suggest:
    post:
      consumes:
      - application/json
      description: Derives a candidate line rule — regex with named captures, plus
        a Go time layout — from pasted sample lines. Nothing is written; the result
        is a starting point for the builder, meant to be corrected against the preview.
      parameters:
      - description: sample text
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.SampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.RuleDraft'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Infer a rule from sample lines
      tags:
      - rules
  /api/settings:
    get:
      consumes:
      - application/json
      description: Persisted to obs_viewer_settings.json next to the binary. Only
        the fields present in the POST body are updated.
      parameters:
      - description: 'POST only: partial settings patch'
        in: body
        name: body
        schema:
          $ref: '#/definitions/server.SettingsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SettingsBody'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get or persist user settings
      tags:
      - core
    post:
      consumes:
      - application/json
      description: Persisted to obs_viewer_settings.json next to the binary. Only
        the fields present in the POST body are updated.
      parameters:
      - description: 'POST only: partial settings patch'
        in: body
        name: body
        schema:
          $ref: '#/definitions/server.SettingsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SettingsBody'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Get or persist user settings
      tags:
      - core
  /api/timerange:
    get:
      description: MIN/MAX of the active timestamp column across the UNION ALL, plus
        the list of timestamp-like columns the engine detected.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.TimeRangeResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      summary: Time bounds of loaded data
      tags:
      - query
  /api/timestamp-field:
    get:
      consumes:
      - application/json
      description: GET returns the column the engine currently sorts by. POST overrides
        it; the engine silently falls back to the default if the requested field is
        absent from the loaded files.
      parameters:
      - description: 'POST only: requested column'
        in: body
        name: body
        schema:
