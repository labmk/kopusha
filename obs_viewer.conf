# obs-viewer core configuration.
#
# This file holds top-level settings (port, timeout, listen). Optional
# modules read their own `obs_viewer_<name>.conf` sibling — a module is
# enabled if and only if its `[<name>]` section is present. No modules
# ship by default; see docs/MODULES.md.
#
# All obs_viewer*.conf files in this directory are merged at startup,
# in alphabetical order. obs_viewer.conf loads first; module-specific
# overrides slot on top. `.example` suffixes are deliberately skipped,
# so a module needing per-site values can ship a template the operator
# activates by renaming it to `.conf`.
#
# Lines starting with # or ; are comments. Missing values fall back
# to the defaults shown.


# HTTP port. Default 9200.
# port = 9200

# Inactivity auto-shutdown in seconds. The server exits when no API
# request has come in for this long. Set 0 to disable. Default 180
# (3 minutes — the SPA's 30s healthcheck poll keeps the timer fresh
# while any tab is open; closing the last tab gives ~3 min to exit).
# timeout = 180

# Bind address. Default 127.0.0.1 (loopback only). A non-loopback
# value is honored ONLY when a TLS cert is provided via --cert/--key;
# otherwise the server falls back to loopback with a warning.
# listen = 0.0.0.0

# Parser rules directory. Holds YAML files that drive autodetect for
# non-NDJSON formats (block records, line logs, XML). Default is
# ./parsers.d next to the executable; set this to a shared path to
# use a curated rule set across multiple installs. Missing directory
# is OK — only NDJSON and EVTX inputs work in that case.
# parsers_dir = parsers.d
